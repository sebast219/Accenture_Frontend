<div class="min-h-screen bg-black">
  <app-home-screen 
    #homeScreen
    *ngIf="currentScreen === 'home'"
    (taskClick)="onTaskClick($event)"
    (newTask)="onNewTask()"
    (categoriesClick)="onCategories()"
  />
  <app-task-detail-screen 
    *ngIf="currentScreen === 'task-detail' && selectedTask"
    [task]="selectedTask"
    (back)="onBack()"
    (taskUpdated)="onTaskUpdated($event)"
  />
  <app-new-task-screen 
    *ngIf="currentScreen === 'new-task'"
    (cancel)="onCancel()"
    (done)="onDone()"
    (taskCreated)="onTaskCreated($event)"
  />
  <app-categories-screen 
    *ngIf="currentScreen === 'categories'"
    (back)="onBack()"
  />

  <!-- Persistent Bottom Navigation Bar -->
  <div class="bottom-nav">
    <div class="flex justify-around items-center py-3">
      <!-- Home Icon -->
      <ion-button 
        fill="clear" 
        (click)="onHome()"
        class="flex flex-col items-center gap-1"
        [class]="currentScreen === 'home' ? 'text-blue-400' : 'text-gray-400'"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
        </svg>
        <span class="text-xs">Home</span>
      </ion-button>
      
      <!-- Categories Icon -->
      <ion-button 
        fill="clear" 
        (click)="onCategories()"
        class="flex flex-col items-center gap-1"
        [class]="currentScreen === 'categories' ? 'text-blue-400' : 'text-gray-400'"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
        </svg>
        <span class="text-xs">Categories</span>
      </ion-button>
      
      <!-- Profile Icon -->
      <ion-button 
        fill="clear" 
        class="flex flex-col items-center gap-1 text-gray-400"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        <span class="text-xs">Profile</span>
      </ion-button>
    </div>
  </div>
</div>
