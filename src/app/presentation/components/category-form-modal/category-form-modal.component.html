<ion-header>
  <ion-toolbar>
    <ion-title>{{ isEditMode ? 'Editar Categoría' : 'Nueva Categoría' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="onCancel()" fill="clear">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form (ngSubmit)="onSave()">
    <!-- Name -->
    <div class="mb-6">
      <ion-label position="stacked" class="block text-sm font-medium text-gray-700 mb-2">
        Nombre de la categoría *
      </ion-label>
      <ion-input
        [(ngModel)]="formData.name"
        name="name"
        type="text"
        placeholder="Ej: Trabajo, Personal, Estudios"
        class="input-field"
        required
      ></ion-input>
    </div>

    <!-- Color Selection -->
    <div class="mb-6">
      <ion-label class="block text-sm font-medium text-gray-700 mb-3">
        Color
      </ion-label>
      <div class="grid grid-cols-6 gap-3">
        <button
          *ngFor="let color of availableColors"
          type="button"
          (click)="selectColor(color)"
          class="w-12 h-12 rounded-xl border-2 transition-all duration-200"
          [ngClass]="{
            'border-gray-300': formData.color !== color,
            'border-gray-800 scale-110 shadow-lg': formData.color === color
          }"
          [style.backgroundColor]="color"
        ></button>
      </div>
    </div>

    <!-- Icon Selection -->
    <div class="mb-6">
      <ion-label class="block text-sm font-medium text-gray-700 mb-3">
        Icono
      </ion-label>
      <div class="grid grid-cols-4 gap-3">
        <button
          *ngFor="let icon of availableIcons"
          type="button"
          (click)="selectIcon(icon)"
          class="flex flex-col items-center justify-center p-3 rounded-xl border-2 transition-all duration-200"
          [ngClass]="{
            'border-gray-200 bg-gray-50': formData.icon !== icon,
            'border-primary-500 bg-primary-50': formData.icon === icon
          }"
        >
          <ion-icon
            [name]="icon"
            class="text-2xl mb-1"
            [ngClass]="{
              'text-gray-400': formData.icon !== icon,
              'text-primary-600': formData.icon === icon
            }"
          ></ion-icon>
        </button>
      </div>
    </div>

    <!-- Preview -->
    <div class="mb-6">
      <ion-label class="block text-sm font-medium text-gray-700 mb-3">
        Vista previa
      </ion-label>
      <div class="flex items-center gap-2 p-3 bg-gray-50 rounded-xl">
        <span
          class="w-4 h-4 rounded-full flex-shrink-0"
          [style.backgroundColor]="formData.color"
        ></span>
        <ion-icon
          [name]="formData.icon || 'folder-outline'"
          class="text-lg text-gray-600"
        ></ion-icon>
        <span class="font-medium text-gray-800">
          {{ formData.name || 'Nombre de la categoría' }}
        </span>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex gap-3">
      <ion-button
        type="button"
        (click)="onCancel()"
        fill="outline"
        expand="block"
        class="flex-1"
      >
        Cancelar
      </ion-button>
      <ion-button
        type="submit"
        [disabled]="!formData.name.trim()"
        expand="block"
        class="flex-1"
      >
        {{ isEditMode ? 'Actualizar' : 'Crear' }}
      </ion-button>
    </div>
  </form>
</ion-content>
