<div *ngIf="stats$ | async as stats" class="card-base mb-4 animate-slide-down">
  <div class="flex items-center justify-between mb-3">
    <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">Resumen</h3>
    <span class="badge-primary">
      {{ stats.completionRate }}% completado
    </span>
  </div>

  <!-- Progress Bar -->
  <div class="w-full bg-gray-100 rounded-full h-2.5 mb-4 overflow-hidden">
    <div
      class="h-2.5 rounded-full transition-all duration-500 ease-out"
      [ngClass]="{
        'bg-danger-500': stats.completionRate < 30,
        'bg-warning-500': stats.completionRate >= 30 && stats.completionRate < 70,
        'bg-success-500': stats.completionRate >= 70
      }"
      [style.width.%]="stats.completionRate"
    ></div>
  </div>

  <!-- Stats Grid -->
  <div class="grid grid-cols-3 gap-3">
    <div class="text-center p-2 bg-gray-50 rounded-xl">
      <div class="text-2xl font-bold text-gray-800">{{ stats.total }}</div>
      <div class="text-xs text-gray-500 mt-0.5">Total</div>
    </div>
    <div class="text-center p-2 bg-success-50 rounded-xl">
      <div class="text-2xl font-bold text-success-600">{{ stats.completed }}</div>
      <div class="text-xs text-gray-500 mt-0.5">Completadas</div>
    </div>
    <div class="text-center p-2 bg-warning-50 rounded-xl">
      <div class="text-2xl font-bold text-warning-600">{{ stats.pending }}</div>
      <div class="text-xs text-gray-500 mt-0.5">Pendientes</div>
    </div>
  </div>
</div>
